name: Dynamic Web to APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Website URL (https://...)'
        required: true
      app_name:
        description: 'App name'
        required: true
      package_name:
        description: 'Android package name'
        required: true
        default: 'com.example.webapp'
      icon_url:
        description: 'Optional public icon URL'
        required: false
      request_id:
        description: 'Unique request id'
        required: true
        default: 'manual'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event.client_payload.app_url || inputs.app_url }}
      APP_NAME: ${{ github.event.client_payload.app_name || inputs.app_name }}
      PACKAGE_NAME: ${{ github.event.client_payload.package_name || inputs.package_name }}
      ICON_URL: ${{ github.event.client_payload.icon_url || inputs.icon_url }}
      REQUEST_ID: ${{ github.event.client_payload.request_id || inputs.request_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install icon tools
        run: python -m pip install --quiet pillow

      - name: Configure app
        run: python scripts/configure_build.py

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "web-to-apk-${REQUEST_ID}.apk"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-to-apk-${{ env.REQUEST_ID }}
          path: web-to-apk-${{ env.REQUEST_ID }}.apk
          retention-days: 7

      - name: Create downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${REQUEST_ID}"
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          gh release create "$TAG" "web-to-apk-${REQUEST_ID}.apk" --title "$APP_NAME" --notes "자동 생성된 WebView APK입니다."
